# GHS-POP classified with the rules Populace runs use, so that comparing it
# with a Populace run separates the population surface from the rules: the
# built-up criterion is off, as in populace_default. The other inputs are
# GHS-SMOD's own, as in the V2.0 reproduction.
population:
  source: ghs_pop
  release: r2023a
grid: moll_1km
land:
  source: ghs_land
  release: r2022a
built:
  source: ghs_built_s
  release: r2023a
time_points: [2020q1, 2025q1]
method:
  name: degurba_r2023a
  parameter_set: populace_default
