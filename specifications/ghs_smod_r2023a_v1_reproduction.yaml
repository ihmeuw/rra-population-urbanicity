# Reproduce GHS-SMOD R2023A V1.0 from its own inputs. V1.0 is documented by the
# original edition of the GHSL Data Package 2023 (PDF dated 2023-10-27) and
# differs from V2.0 (parameter set ghsl_r2023a) in the nine parameters below.
population:
  source: ghs_pop
  release: r2023a
grid: moll_1km
land:
  source: ghs_land
  release: r2022a
built:
  source: ghs_built_s
  release: r2023a
time_points: [2020q1, 2025q1]
method:
  name: degurba_r2023a
  parameter_set: ghsl_r2023a
  parameters:
    # Class 22 (Table 22 and footnote 32 of the original edition).
    sduc_density: 300
    sduc_size: 5000
    sduc_contiguity: 8
    # The original does not state the buffer's shape; square, as in V2.0.
    sduc_buffer_cells: 3
    # The original Figure 28 tests proximity on whole clusters.
    sduc_buffer_test: drop_cluster
    # The original edition has no dense-cell requirement.
    uc_require_dense_cell: false
    duc_require_dense_cell: false
    # Footnote 30 of the original edition: the threshold comes from each run's
    # own built-up layer, on clusters of at least 5,000 people.
    built_threshold_cluster_size: 5000
    built_threshold_epoch: each_time_point
