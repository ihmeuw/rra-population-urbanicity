name: Outdated dependencies

# Runs only by hand, from the Actions tab. It reports outdated direct dependencies
# on the run's summary page; updating them stays manual (see the README).
on:
  workflow_dispatch:

jobs:
  outdated-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-poetry-env
      - name: List outdated direct dependencies
        run: |
          {
            echo "### Outdated direct dependencies"
            echo
            echo "| Package | Locked | Latest |"
            echo "| --- | --- | --- |"
            poetry show --outdated --top-level --no-ansi \
              | sed 's/ (!)//' \
              | awk '{print "| " $1 " | " $2 " | " $3 " |"}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
